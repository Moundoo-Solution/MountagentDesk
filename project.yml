# XcodeGen spec. Run `xcodegen generate` (or scripts/build-app.sh); the .xcodeproj is not committed.
name: MountagentDesk
options:
  bundleIdPrefix: dev.mountagent
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEAD_CODE_STRIPPING: YES
    # One executable in Debug too (the preview dylib would need its own signature).
    ENABLE_DEBUG_DYLIB: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  MountagentDeskKit:
    path: Packages/MountagentDeskKit
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.2.0
targets:
  MountagentDesk:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - MountagentDesk.entitlements
    dependencies:
      - package: MountagentDeskKit
      - package: SwiftTerm
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Mountagent Desk
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: Copyright © 2026 Mountagent Desk contributors. MIT License.
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        NSMicrophoneUsageDescription: Mountagent Desk listens while you dictate a message to the agent.
        NSSpeechRecognitionUsageDescription: Mountagent Desk turns what you say into text in the chat box.
    entitlements:
      # Not sandboxed: the app has to launch the claude and cursor-agent CLIs and open any
      # project folder. That rules out the Mac App Store; ship with Developer ID instead.
      path: App/MountagentDesk.entitlements
      properties:
        # Voice input in the composer (hardened runtime blocks the microphone without it).
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mountagent.MountagentDesk
        PRODUCT_NAME: Mountagent Desk
        PRODUCT_MODULE_NAME: MountagentDesk
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        COMBINE_HIDPI_IMAGES: YES
    scheme:
      testTargets: []
